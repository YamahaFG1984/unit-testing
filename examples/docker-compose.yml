# 示例项目用的 PostgreSQL。每个开发者在自己机器上起一个实例（第 10 章）。
#   启动：docker compose up -d --wait
#   重建：docker compose down -v && docker compose up -d --wait
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      # 容器第一次初始化时，按文件名顺序执行这些迁移脚本
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 1s
      timeout: 3s
      retries: 30
